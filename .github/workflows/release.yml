name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Create release PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        id: publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only publish on release version commits
          COMMIT_MSG=$(git log -1 --format='%s')
          if echo "$COMMIT_MSG" | grep -qE '^chore\(release\): version packages'; then
            echo "Release commit detected — publishing to npm"
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
            pnpm release
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not a release commit — skipping publish"
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mirror published packages to GitHub Packages
        if: steps.publish.outputs.published == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat >> .npmrc <<EOF
          @reaatech:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
          EOF
          for name in $(node -e "
            const {execSync} = require('child_process');
            const tags = execSync('git tag --points-at HEAD').toString().trim().split('\n').filter(Boolean);
            const pkgs = tags.filter(t => t.startsWith('@reaatech/'));
            pkgs.forEach(p => console.log(p.split('@')[0] + '@' + p.split('@')[1]));
          "); do
            dir="packages/${name#@reaatech/tool-use-firewall-}"
            if [ ! -d "$dir" ]; then
              echo "ERROR: Cannot determine directory for package $name (expected $dir)"
              exit 1
            fi
            echo "Mirroring $name -> $dir"
            (cd "$dir" && npm publish --registry=https://npm.pkg.github.com)
          done
